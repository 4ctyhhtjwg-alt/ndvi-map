<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sentinel-2 NDVI マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
 html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
 #bar{position:absolute;z-index:1000;top:8px;left:50px;right:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fffe;padding:6px 8px;border-radius:8px;box-shadow:0 1px 6px #0004}
 #bar button,#bar select,#bar input{font-size:13px;padding:4px 6px}
 #bar button.on{background:#2e7d32;color:#fff}
 #map{height:100%}
 #info{position:absolute;z-index:1000;bottom:8px;left:8px;right:8px;max-width:420px;background:#fffe;padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px #0004;line-height:1.5}
 #legend{height:10px;margin-top:4px;border-radius:3px;background:linear-gradient(90deg,#7a4a21,#d9c36a,#a8d05a,#2e9a3a,#0b5d1e)}
 #legend+div{display:flex;justify-content:space-between;font-size:11px}
</style>
</head>
<body>
<div id="bar">
 <button id="m1" class="on">点で取得</button>
 <button id="m2">範囲で取得</button>
 <input id="q" placeholder="地名・住所" size="12"><button id="go">検索</button>
 <select id="days"><option value="30">過去30日</option><option value="60">過去60日</option><option value="120">過去120日</option><option value="365" selected>過去1年</option></select>
 <select id="cloud"><option value="10">雲量&lt;10%</option><option value="30" selected>雲量&lt;30%</option><option value="60">雲量&lt;60%</option></select>
 <select id="scene" style="max-width:160px"><option>撮影日</option></select>
 <label><input type="checkbox" id="ov" checked> オーバーレイ</label>
</div>
<div id="map"></div>
<div id="info">地図をクリックしてNDVIを取得します。<div id="mk" style="display:none;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:12px"><label style="color:#8d6e63">播種日<br><input type="date" id="d1" style="font-size:12px;width:112px"></label><label style="color:#1565c0">幼穂形成始期<br><input type="date" id="d4" style="font-size:12px;width:112px"></label><label style="color:#e65100">出穂日<br><input type="date" id="d2" style="font-size:12px;width:112px"></label><label style="color:#6a1b9a">成熟期<br><input type="date" id="d3" style="font-size:12px;width:112px"></label></div><canvas id="ch" style="display:none;width:100%;height:170px;margin-top:6px"></canvas><div id="legend"></div><div><span>0</span><span>0.5</span><span>1.0</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>
const $=id=>document.getElementById(id), info=h=>$('info').firstChild.nodeValue!==undefined&&($('info').childNodes[0].textContent=''),
  setMsg=t=>{$('info').childNodes[0].textContent=t};
const map=L.map('map').setView([31.9,131.4],12);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
L.control.layers({'衛星写真':sat,'地図':osm}).addTo(map);

let mode=1, corner=null, geom=null, scenes=[], marker=null, rect=null, overlay=null;
$('m1').onclick=()=>setMode(1); $('m2').onclick=()=>setMode(2);
function setMode(m){mode=m;corner=null;$('m1').classList.toggle('on',m==1);$('m2').classList.toggle('on',m==2);
 setMsg(m==1?'地図をクリックしてNDVIを取得します。':'範囲の対角2点をクリックしてください。')}

$('go').onclick=async()=>{const q=$('q').value.trim();if(!q)return;
 const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));
 const j=await r.json(); j[0]?map.setView([+j[0].lat,+j[0].lon],14):setMsg('見つかりませんでした');};

map.on('click',async e=>{
 if(mode==1){geom={t:'p',ll:e.latlng};clearShapes();marker=L.circleMarker(e.latlng,{radius:6,color:'#fff',fillColor:'#e91e63',fillOpacity:1}).addTo(map);await refresh(true)}
 else if(!corner){corner=e.latlng;setMsg('もう1点をクリックしてください。')}
 else{const b=L.latLngBounds(corner,e.latlng);corner=null;geom={t:'r',b};clearShapes();
  rect=L.rectangle(b,{color:'#e91e63',weight:2,fill:false}).addTo(map);await refresh(true)}
});
function clearShapes(){[marker,rect,overlay].forEach(l=>l&&map.removeLayer(l));marker=rect=overlay=null}
$('scene').onchange=()=>refresh(false);
$('ov').onchange=()=>{if(overlay)$('ov').checked?overlay.addTo(map):map.removeLayer(overlay)};
$('days').onchange=$('cloud').onchange=()=>geom&&refresh(true);

async function search(){
 const c=geom.t=='p'?geom.ll:geom.b.getCenter(), rg=range(), start=new Date(rg.t0), end=new Date(rg.t1+864e5); win=rg;
 const body={collections:['sentinel-2-l2a'],intersects:{type:'Point',coordinates:[c.lng,c.lat]},
  datetime:start.toISOString()+'/'+end.toISOString(),query:{'eo:cloud_cover':{lt:+$('cloud').value}},limit:geom.t=='p'?200:25,
  sort:[{field:'properties.datetime',direction:'desc'}]};
 const r=await fetch('https://earth-search.aws.element84.com/v1/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error('STAC検索に失敗しました ('+r.status+')');
 return (await r.json()).features;
}

async function refresh(newSearch){
 try{
  if(newSearch){setMsg('シーンを検索中…');scenes=await search();
   $('scene').innerHTML=scenes.map((s,i)=>`<option value="${i}">${s.properties.datetime.slice(0,10)} (雲${Math.round(s.properties['eo:cloud_cover'])}%)</option>`).join('')||'<option>該当なし</option>';
   if(!scenes.length){setMsg('条件に合うシーンがありません。期間や雲量を緩めてください。');return}}
  const s=scenes[+$('scene').value]; setMsg('NDVIを計算中…');
  if(geom.t=='p'){await doPoint(s);if(newSearch)series()}else await doRect(s);
 }catch(err){console.error(err);setMsg('エラー: '+err.message)}
}

const cache={};
const open=async u=>cache[u]||(cache[u]=await GeoTIFF.fromUrl(u).then(t=>t.getImage()));
function ctx(s){
 const p=s.properties, code=p['proj:epsg']||+String(p['proj:code']||'').replace(/\D/g,''), zone=code%100, south=Math.floor(code/100)==327;
 const utm=`+proj=utm +zone=${zone}${south?' +south':''} +datum=WGS84 +units=m +no_defs`;
 const a=s.assets.red, tr=a['proj:transform']||s.assets.red['proj:transform'];
 const ap=p['earthsearch:boa_offset_applied']===true; // 補正済みなら二重に引かない
 const bd=k=>{const b=(s.assets[k]['raster:bands']||[{}])[0];return {sc:b.scale??1e-4,of:ap?0:(b.offset??0)}};
 return {utm,tr,r:bd('red'),n:bd('nir')};
}
const toPix=(c,lng,lat)=>{const [x,y]=proj4('EPSG:4326',c.utm,[lng,lat]);return [(x-c.tr[2])/c.tr[0],(y-c.tr[5])/c.tr[4]]};
const toLL=(c,px,py)=>{const [lng,lat]=proj4(c.utm,'EPSG:4326',[c.tr[2]+px*c.tr[0],c.tr[5]+py*c.tr[4]]);return [lat,lng]};
const ndvi=(c,r,n)=>{if(!r&&!n)return NaN;const R=r*c.r.sc+c.r.of,N=n*c.n.sc+c.n.of;const v=(N-R)/(N+R);return Math.abs(v)<=1?v:NaN};

async function read(s,win,w,h){
 const [ri,ni]=await Promise.all([open(s.assets.red.href),open(s.assets.nir.href)]);
 const o={window:win,interleave:false,resampleMethod:'nearest'}; if(w){o.width=w;o.height=h}
 const [R,N]=await Promise.all([ri.readRasters(o),ni.readRasters(o)]);
 return {R:R[0],N:N[0],W:ri.getWidth(),H:ri.getHeight()};
}

async function doPoint(s){
 const c=ctx(s), [px,py]=toPix(c,geom.ll.lng,geom.ll.lat).map(Math.floor);
 const d=await read(s,[px,py,px+1,py+1]), v=ndvi(c,d.R[0],d.N[0]);
 const rr=d.R[0]*c.r.sc+c.r.of,nn=d.N[0]*c.n.sc+c.n.of,dt=s.properties.datetime.slice(0,10);
 base=isNaN(v)?`この地点は欠測または範囲外です (${dt} 赤${rr.toFixed(3)} 近赤${nn.toFixed(3)} 補正${c.r.of})`:`NDVI = ${v.toFixed(3)}　(${dt} 赤${rr.toFixed(3)} 近赤${nn.toFixed(3)})`;setMsg(base);
}

let base='',runId=0,sel=null,win=null;
const MK=[['d1','播種','#8d6e63'],['d2','出穂','#e65100'],['d3','成熟','#6a1b9a'],['d4','幼穂形成始期','#1565c0']];
const mk=()=>MK.map(([id,n,c])=>({n,c,t:$(id).value?new Date($(id).value+'T00:00:00').getTime():null})).filter(o=>o.t);
function range(){const t1=Date.now(),t0=t1-$('days').value*864e5,m=mk().map(o=>o.t);return {t0:Math.min(t0,...m),t1:Math.max(t1,...m)}}
try{const v=JSON.parse(localStorage.getItem('ndvi_mk')||'[]');MK.forEach(([id],i)=>{if(v[i])$(id).value=v[i]})}catch(e){}
MK.forEach(([id])=>$(id).onchange=()=>{
 try{localStorage.setItem('ndvi_mk',JSON.stringify(MK.map(([i])=>$(i).value)))}catch(e){}
 if(!geom||geom.t!='p')return;const r=range();
 if(!win||r.t0<win.t0-1||r.t1>win.t1+1)refresh(true);else draw($('ch')._raw||[])});
async function pixelNdvi(s,ll){
 const c=ctx(s),[px,py]=toPix(c,ll.lng,ll.lat).map(Math.floor);
 const [ri,ni,si]=await Promise.all([open(s.assets.red.href),open(s.assets.nir.href),open(s.assets.scl.href)]);
 if(px<0||py<0||px>=ri.getWidth()||py>=ri.getHeight())return null;
 const st=s.assets.scl['proj:transform'],sx=Math.floor((c.tr[2]+(px+.5)*c.tr[0]-st[2])/st[0]),sy=Math.floor((c.tr[5]+(py+.5)*c.tr[4]-st[5])/st[4]),w=[px,py,px+1,py+1];
 const [R,N,S]=await Promise.all([ri.readRasters({window:w}),ni.readRasters({window:w}),si.readRasters({window:[sx,sy,sx+1,sy+1]})]);
 if([0,1,3,8,9,10].includes(S[0][0]))return null; // 欠測・影・雲・巻雲を除外
 const v=ndvi(c,R[0][0],N[0][0]);return isNaN(v)?null:v;
}
async function series(){
 sel=null;const id=++runId,ll=geom.ll,pts=[],list=[...scenes].reverse();let i=0,done=0;
 $('ch').style.display='block';$('mk').style.display='flex';draw(pts);
 const worker=async()=>{while(i<list.length&&id===runId){const s=list[i++];
  try{const v=await pixelNdvi(s,ll);if(v!=null)pts.push({t:new Date(s.properties.datetime),v})}catch(e){console.warn(e)}
  done++;if(id===runId){draw(pts);setMsg(base+`　／ 時系列 ${done}/${list.length}シーン処理 (有効${pts.length})`)}}};
 await Promise.all(Array.from({length:6},worker));
}
$('ch').addEventListener('click',e=>{const cv=$('ch'),r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
 let best=null,bd=1e9;(cv._pts||[]).forEach(o=>{const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;best=o}});
 if(best&&bd<30){sel=best.p.t.getTime();draw(cv._raw)}});
function draw(pts){
 const cv=$('ch'),dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
 const g=cv.getContext('2d');g.scale(dpr,dpr);
 const P=[...pts].sort((a,b)=>a.t-b.t),m={l:28,r:8,t:8,b:18},{t0,t1}=range();
 const lo=Math.min(0,...P.map(p=>p.v)),X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>m.t+(1-(v-lo))/(1-lo)*(H-m.t-m.b);
 g.font='10px sans-serif';g.fillStyle='#555';g.strokeStyle='#ddd';g.lineWidth=1;
 for(let v=Math.ceil(lo*5)/5;v<=1.001;v+=.2){g.beginPath();g.moveTo(m.l,Y(v));g.lineTo(W-m.r,Y(v));g.stroke();g.fillText(v.toFixed(1),2,Y(v)+3)}
 for(let k=0;k<=3;k++){const t=new Date(t0+(t1-t0)*k/3);g.fillText(`${t.getMonth()+1}/${t.getDate()}`,Math.min(X(+t)-8,W-30),H-4)}
 mk().filter(o=>o.t>=t0&&o.t<=t1).forEach((o,i)=>{const x=X(o.t),d=new Date(o.t),t=`${o.n} ${d.getMonth()+1}/${d.getDate()}`;
  g.strokeStyle=o.c;g.lineWidth=1.5;g.setLineDash([4,3]);g.beginPath();g.moveTo(x,m.t);g.lineTo(x,H-m.b);g.stroke();g.setLineDash([]);
  g.font='bold 10px sans-serif';const w=g.measureText(t).width;g.fillStyle=o.c;g.fillText(t,x+w+4>W-m.r?x-w-3:x+3,m.t+10+i*11)});
 cv._raw=pts;cv._pts=P.map(p=>({p,x:X(p.t),y:Y(p.v)}));
 if(!P.length){g.fillText('取得中…',m.l+10,H/2);return}
 g.strokeStyle='#2e7d32';g.lineWidth=1.5;g.beginPath();P.forEach((p,k)=>k?g.lineTo(X(p.t),Y(p.v)):g.moveTo(X(p.t),Y(p.v)));g.stroke();
 g.fillStyle='#2e7d32';P.forEach(p=>{g.beginPath();g.arc(X(p.t),Y(p.v),2.5,0,7);g.fill()});
 const q=sel&&cv._pts.find(o=>o.p.t.getTime()===sel);
 if(q){g.fillStyle='#e91e63';g.beginPath();g.arc(q.x,q.y,5,0,7);g.fill();
  const t=`${q.p.t.getMonth()+1}/${q.p.t.getDate()}  NDVI ${q.p.v.toFixed(3)}`;g.font='bold 11px sans-serif';
  const w=g.measureText(t).width+8,bx=Math.min(Math.max(q.x-w/2,m.l),W-w-2),by=q.y<40?q.y+8:q.y-24;
  g.fillStyle='#fffe';g.fillRect(bx,by,w,16);g.strokeStyle='#e91e63';g.strokeRect(bx,by,w,16);g.fillStyle='#000';g.fillText(t,bx+4,by+12)}
}
const ramp=[[0,[122,74,33]],[.2,[217,195,106]],[.4,[168,208,90]],[.65,[46,154,58]],[1,[11,93,30]]];
function color(v){v=Math.max(0,Math.min(1,v));for(let i=1;i<ramp.length;i++)if(v<=ramp[i][0]){const[a,A]=ramp[i-1],[b,B]=ramp[i],t=(v-a)/(b-a);return A.map((x,k)=>x+(B[k]-x)*t)}return ramp[4][1]}

async function doRect(s){
 $('ch').style.display='none';$('mk').style.display='none';runId++;
 const c=ctx(s), b=geom.b, P=[[b.getWest(),b.getSouth()],[b.getEast(),b.getNorth()],[b.getWest(),b.getNorth()],[b.getEast(),b.getSouth()]].map(q=>toPix(c,...q));
 const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
 let x0=Math.floor(Math.min(...xs)),x1=Math.ceil(Math.max(...xs)),y0=Math.floor(Math.min(...ys)),y1=Math.ceil(Math.max(...ys));
 const big=await open(s.assets.red.href); x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(big.getWidth(),x1);y1=Math.min(big.getHeight(),y1);
 if(x1<=x0||y1<=y0){setMsg('範囲がこのシーンの外です。別の撮影日を選んでください。');return}
 const k=Math.min(1,700/Math.max(x1-x0,y1-y0)), w=Math.max(1,Math.round((x1-x0)*k)), h=Math.max(1,Math.round((y1-y0)*k));
 const d=await read(s,[x0,y0,x1,y1],w,h), cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d'), im=cx.createImageData(w,h); let sum=0,cnt=0,mn=9,mx=-9;
 for(let i=0;i<w*h;i++){const v=ndvi(c,d.R[i],d.N[i]);if(isNaN(v)){im.data[i*4+3]=0;continue}
  const [r,g,bl]=color(v);im.data.set([r,g,bl,200],i*4);sum+=v;cnt++;mn=Math.min(mn,v);mx=Math.max(mx,v)}
 cx.putImageData(im,0,0);
 const ll=[toLL(c,x0,y0),toLL(c,x1,y1)], bnds=L.latLngBounds(ll);
 overlay&&map.removeLayer(overlay); overlay=L.imageOverlay(cv.toDataURL(),bnds,{interactive:false});
 if($('ov').checked)overlay.addTo(map);
 setMsg(cnt?`平均NDVI = ${(sum/cnt).toFixed(3)}　(最小 ${mn.toFixed(2)} / 最大 ${mx.toFixed(2)}、${s.properties.datetime.slice(0,10)})`:'有効なデータがありません。');
}
</script>
</body>
</html>
